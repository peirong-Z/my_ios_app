workflows:
  ios-real-device:
    name: iOS Real Device Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - flutter packages pub get
      
      # 构建真机调试版（无签名）
      - flutter build ios --debug --no-codesign
      
      # 打包为 .ipa（修正缩进和路径）
      - cd build/ios/iphoneos && mkdir -p Payload
      - cd build/ios/iphoneos && cp -r Runner.app Payload/
      - cd build/ios/iphoneos && zip -r app.ipa Payload
      
      # 验证产物存在
      - ls -lh build/ios/iphoneos/app.ipa
    artifacts:
      - build/ios/iphoneos/app.ipa
      - build/ios/iphoneos/Runner.app