workflows:
  ios-real-device:
    name: iOS Real Device Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles: []  # 无签名，稍后重签
        certificates: []
    scripts:
      - flutter packages pub get
      
      # 真机构建（无签名）
      - flutter build ios --debug --no-codesign
      
      # 检查构建目录
      - ls -la build/ios/
      
      # 打包（如真机目录存在）
      - |
        if [ -d "build/ios/iphoneos" ]; then
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../app.ipa Payload
          echo "Built for real device"
        else
          echo "Error: Real device build not found"
          exit 1
        fi
    artifacts:
      - build/ios/app.ipa
      - build/ios/iphoneos/Runner.app